server {
 client_max_body_size 128k;
 add_header Permissions-Policy "camera=(), geolocation=()" always;
 listen 80;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location / { try_files $uri /index.html; }
 location = /about { try_files /about.html =404; }
 location = /about/ { return 301 /about; }
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $atlas_backend api:8000;
 location = /api/files { client_max_body_size 6m; proxy_pass http://$atlas_backend; proxy_set_header Host $http_host; proxy_http_version 1.1; proxy_read_timeout 60s; }
 location = /api/voice/events { proxy_pass http://$atlas_backend; proxy_set_header Host $http_host; proxy_set_header Connection ""; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; gzip off; proxy_read_timeout 360s; }
 location /api/ { proxy_pass http://$atlas_backend; proxy_set_header Host $http_host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_http_version 1.1; proxy_read_timeout 120s; }
}
