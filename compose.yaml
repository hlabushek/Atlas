services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U atlas]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
  migrate:
    build: ./backend
    env_file: .env
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: ./backend
    env_file: .env
    command: [uvicorn, atlas.api:app, --host, 0.0.0.0, --port, '8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    command: [python, -m, atlas.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  scheduler:
    build: ./backend
    env_file: .env
    command: [python, -m, atlas.scheduler]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  telegram:
    build: ./backend
    env_file: .env
    command: [python, -m, atlas.telegram]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ['127.0.0.1:8080:80']
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
