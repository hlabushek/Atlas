# Add this overlay only after configuring a separate random browser service token.
services:
  browser:
    build:
      context: ./backend
      dockerfile: Browser.Dockerfile
    environment:
      ATLAS_BROWSER_SERVICE_TOKEN: ${ATLAS_BROWSER_SERVICE_TOKEN:?Set a separate random browser token}
    networks: [browser_control, browser_egress]
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    shm_size: 256m
    restart: unless-stopped
  api:
    environment:
      ATLAS_BROWSER_SERVICE_URL: http://browser:8787
      ATLAS_BROWSER_SERVICE_TOKEN: ${ATLAS_BROWSER_SERVICE_TOKEN:?Set a separate random browser token}
    networks: [default, browser_control]
    depends_on: [browser]
  scheduler:
    environment:
      ATLAS_BROWSER_SERVICE_URL: http://browser:8787
      ATLAS_BROWSER_SERVICE_TOKEN: ${ATLAS_BROWSER_SERVICE_TOKEN:?Set a separate random browser token}
    networks: [default, browser_control]
    depends_on: [browser]
networks:
  browser_control:
    internal: true
  browser_egress: {}
