# Optional production HTTPS overlay. Configure certificate paths and external origin first.
services:
  api:
    environment:
      ATLAS_COOKIE_SECURE: 'true'
  web:
    ports: !override ['127.0.0.1:8443:443']
    volumes:
      - ./ops/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ATLAS_TLS_CERT:?Set ATLAS_TLS_CERT}:/run/tls/server.crt:ro
      - ${ATLAS_TLS_KEY:?Set ATLAS_TLS_KEY}:/run/tls/server.key:ro
